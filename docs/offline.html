mary:"移动支点两边的距离和钩码，找出什么时候省力、什么时候费力。",params:[{key:"load",label:"阻力（钩码）",min:1,max:6,default:3,unit:"个"},{key:"ld",label:"阻力点到支点",min:1,max:6,default:2,unit:"格"},{key:"ed",label:"用力点到支点",min:1,max:6,default:4,unit:"格"}],experiment:{goal:"研究杠杆在什么情况下省力、什么情况下费力。",tools:["杠杆尺和支架","钩码若干","记录表"],steps:["先把杠杆尺调到水平平衡。","在支点一侧某一格挂上钩码（阻力）。","在另一侧不同格挂钩码，直到杠杆尺重新平衡。","记录两边的钩码数和格数，找规律。"],observe:"用力点离支点越远，需要的钩码越少；用力点比阻力点离支点近时，需要更多钩码。",explain:"杠杆平衡时，左边“钩码数 × 格数”等于右边“钩码数 × 格数”。用力点到支点的距离大于阻力点到支点的距离，就省力。",safety:"钩码要挂牢，不要让钩码掉下砸到脚。",think:"剪刀、筷子、开瓶器，哪个是省力杠杆，哪个是费力杠杆？",virtualNote:"模拟忽略杠杆尺本身的重量和摩擦；真实实验要先调平，读数可能有小误差。"}},slope:{id:"slope",subject:"science",title:"斜面的作用",grades:[6],summary:"改变斜面的长和高，看沿斜面拉物体需要多大的力。",params:[{key:"g",label:"物体重",min:2,max:10,default:6,unit:"牛"},{key:"h",label:"斜面高",min:10,max:50,default:30,unit:"厘米"},{key:"len",label:"斜面长",min:60,max:150,default:90,unit:"厘米"}],experiment:{goal:"研究斜面能不能省力，坡度和用力大小有什么关系。",tools:["木板（做斜面）","几块书或木块（垫高）","带钩小车或木块","测力计","直尺"],steps:["用测力计直接提起小车，记下读数。","用木板搭一个斜面，沿斜面匀速拉小车上去，记下读数。","高度不变，换长一点的木板（坡度变缓）再测一次。"],observe:"沿斜面拉比直接提起用的力小；高度相同时，斜面越长（坡越缓）越省力。",explain:"斜面把“直接举高”变成“沿着坡慢慢上”，走的路更长，用的力就更小。",safety:"斜面要放稳，小车滑下来时不要用手硬挡。",think:"盘山公路为什么要修得弯弯曲曲？",virtualNote:"模拟按没有摩擦的理想斜面计算，真实测量时读数会比模拟大一些。"}},sound:{id:"sound",subject:"science",title:"声音的高低和强弱",grades:[4],summary:"改变拨钢尺的力度和钢尺伸出的长度，听声音的强弱和高低。",params:[{key:"force",label:"拨动的力",min:0,max:4,default:2,options:["很轻","轻","中等","重","很重"]},{key:"len",label:"钢尺伸出桌面",min:5,max:20,default:12,unit:"厘米"}],experiment:{goal:"研究声音的强弱、高低和什么有关。",tools:["钢尺","桌子","直尺"],steps:["把钢尺一端压在桌边，另一端伸出桌面。","长度不变，分别轻拨和重拨，听声音并看振动的幅度。","力度不变，改变伸出的长度，听声音的高低。"],observe:"用力越大，钢尺振动幅度越大，声音越响；伸出越短，振动越快，声音越高。",explain:"声音是由物体振动产生的。振动幅度大小决定声音强弱，振动快慢决定声音高低。",safety:"压紧钢尺，拨动时不要把脸凑得太近。",think:"吉他上的弦按得越短，声音会怎样变化？",virtualNote:"屏幕上的波形只是示意，真实的声音要动手拨一拨、用耳朵听。"}},earth:{id:"earth",subject:"science",title:"昼夜交替与地球自转",grades:[5,6],summary:"转动地球，看北京什么时候是白天、什么时候是黑夜，太阳在哪个方向。",params:[{key:"hour",label:"北京时间",min:0,max:23,default:8,unit:"
