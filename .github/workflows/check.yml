name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release
      - name: Check release artifacts
        run: git diff --exit-code -- site/

  # 浏览器冒烟测试：只装 Chromium（headless shell），用本地 vite preview 打开构建产物，不访问外网。
  # 包含 36 节课的手机/电脑访问和 React 状态回归；AI 完全由本地 fetch 模拟。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run build
      - name: Browser smoke and React state regression
        run: npm run test:smoke

  # 官网/充值/客服/存储禁用/错误边界等站点检查：按正式参数构建后本地起服务测试。
  # 全部请求拦在本机，不访问外网，不调用模型；只用官方 actions，不读密钥。
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Release with production switches
        run: TOPUP_OPEN=false VITE_EVENT_ENDPOINT=/e VITE_HELP_ENDPOINT=/api/help npm run release
      - name: Release leaves a clean worktree and passes deploy check
        run: |
          status=$(git status --porcelain)
          if [ -n "$status" ]; then printf '%s\n' "$status"; exit 1; fi
          npm run deploy:site -- --check
      - name: Site checks
        run: npm run test:site
      - name: Release artifacts unchanged after site checks
        run: git diff --exit-code -- site/
